<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generator mowy — ElevenLabs</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <p class="eyebrow">ElevenLabs · Text to Speech</p>
        <h1>Wpisz tekst i posłuchaj</h1>
        <p class="lead">
          Wybierz jeden z dwóch głosów, wklej tekst (do 5000 znaków) i kliknij
          „Generuj audio”.
        </p>
      </header>

      <section class="panel">
        <label class="field">
          <span>Głos</span>
          <select id="voiceSelect"></select>
        </label>

        <label class="field field-text">
          <span>Tekst</span>
          <textarea
            id="textInput"
            rows="8"
            placeholder="Wpisz tutaj tekst do odczytania…"
            maxlength="5000"
          ></textarea>
          <p class="counter"><span id="charCount">0</span> / 5000</p>
        </label>

        <details id="apiKeySection" class="api-key-box" hidden>
          <summary>Klucz API (tylko jeśli strona go nie ma)</summary>
          <label class="field">
            <span>xi-api-key</span>
            <input
              id="apiKeyInput"
              type="password"
              autocomplete="off"
              placeholder="sk_…"
            />
          </label>
          <p class="hint">
            Klucz zostaje tylko w tej przeglądarce (sessionStorage). Nie udostępniaj
            go publicznie.
          </p>
        </details>

        <div class="actions">
          <button type="button" id="generateBtn" class="btn primary">
            Generuj audio
          </button>
          <button type="button" id="downloadBtn" class="btn" disabled>
            Pobierz MP3
          </button>
        </div>

        <div class="player-wrap" hidden id="playerWrap">
          <audio id="audioPlayer" controls></audio>
        </div>

        <p id="statusText" class="status-line" aria-live="polite"></p>
        <p id="errorBox" class="error" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
