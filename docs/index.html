<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text to Speech</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #f3d9e4;
        color: #1a1a1a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.25rem;
      }
      .block {
        width: 100%;
        max-width: 26rem;
        background: #fff;
        padding: 2rem 1.75rem 1.75rem;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      .btn-submit {
        background: #7b4fa8;
        color: #fff;
      }
    </style>
    <link rel="stylesheet" href="__BASE__/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="block">
        <form class="block-form" id="ttsForm" novalidate>
          <label class="field">
            <select id="voiceSelect" class="input" aria-label="Voice"></select>
          </label>

          <label class="field">
            <textarea
              id="textInput"
              class="input"
              rows="5"
              maxlength="5000"
              aria-label="Text"
              required
            ></textarea>
          </label>

          <button type="submit" id="generateBtn" class="btn-submit">Generate speech</button>
        </form>

        <div class="player-wrap" hidden id="playerWrap">
          <audio id="audioPlayer" controls></audio>
        </div>

        <p id="statusText" class="status-line" aria-live="polite"></p>
        <p id="errorBox" class="error" hidden></p>
      </section>
    </main>

    <script src="__BASE__/app.js"></script>
  </body>
</html>
