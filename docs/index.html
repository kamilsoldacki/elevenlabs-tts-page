<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text to Speech</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="block">
        <h1 class="block-title">Generuj mowę</h1>

        <form class="block-form" id="ttsForm" novalidate>
          <label class="field">
            <span class="field-label">Głos</span>
            <select id="voiceSelect" class="input"></select>
          </label>

          <label class="field">
            <span class="field-label">Tekst<span class="req">*</span></span>
            <textarea
              id="textInput"
              class="input"
              rows="5"
              maxlength="5000"
              required
            ></textarea>
          </label>

          <details id="apiKeySection" class="api-key-box" hidden>
            <summary>Klucz API (tylko lokalnie)</summary>
            <label class="field">
              <span class="field-label">xi-api-key<span class="req">*</span></span>
              <input
                id="apiKeyInput"
                class="input"
                type="password"
                autocomplete="off"
              />
            </label>
          </details>

          <button type="submit" id="generateBtn" class="btn-submit">Submit</button>
        </form>

        <div class="player-wrap" hidden id="playerWrap">
          <audio id="audioPlayer" controls></audio>
        </div>

        <p id="statusText" class="status-line" aria-live="polite"></p>
        <p id="errorBox" class="error" hidden></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
