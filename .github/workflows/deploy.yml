# Statyczna strona z folderu docs/ + wstrzyknięcie klucza z GitHub Secrets.
# Settings → Pages → Source: GitHub Actions
#
# Secret lub variable: VITE_ELEVENLABS_API_KEY lub ELEVENLABS_API_KEY

name: Deploy Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve API key
        id: apikey
        env:
          FROM_SECRET_VITE: ${{ secrets.VITE_ELEVENLABS_API_KEY }}
          FROM_SECRET: ${{ secrets.ELEVENLABS_API_KEY }}
          FROM_VAR_VITE: ${{ vars.VITE_ELEVENLABS_API_KEY }}
          FROM_VAR: ${{ vars.ELEVENLABS_API_KEY }}
        run: |
          key="${FROM_SECRET_VITE:-${FROM_SECRET:-${FROM_VAR_VITE:-$FROM_VAR}}}"
          if [ -z "$key" ]; then
            echo "::error::Brak klucza. Dodaj secret: ELEVENLABS_API_KEY"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Inject API key into app.js
        env:
          API_KEY: ${{ steps.apikey.outputs.key }}
        run: |
          python3 -c "
          import os, pathlib
          p = pathlib.Path('docs/app.js')
          p.write_text(p.read_text(encoding='utf-8').replace('__ELEVENLABS_API_KEY__', os.environ['API_KEY']), encoding='utf-8')
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
